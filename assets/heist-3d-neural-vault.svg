<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%" style="background:#090c10;border-radius:10px;font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">
  <defs>
    <!-- Glowing Crimson Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF334B" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF334B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF334B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <linearGradient id="redFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF334B" stop-opacity="0.02" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="blueprintGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      .spin-cw {
        transform-origin: 170px 160px;
        animation: spinCW 24s linear infinite;
      }
      .spin-ccw {
        transform-origin: 170px 160px;
        animation: spinCCW 18s linear infinite;
      }
      .spin-fast {
        transform-origin: 170px 160px;
        animation: spinCW 8s linear infinite;
      }
      .pulse-core {
        animation: pulseCore 2.5s ease-in-out infinite;
      }
      .laser-scan {
        animation: laserScan 4s ease-in-out infinite;
      }
      .laser-sweep {
        transform-origin: 170px 160px;
        animation: radarSweep 6s linear infinite;
      }
      .eq-bar-1 { animation: eqHeight1 1.2s ease-in-out infinite alternate; }
      .eq-bar-2 { animation: eqHeight2 0.9s ease-in-out infinite alternate; }
      .eq-bar-3 { animation: eqHeight3 1.5s ease-in-out infinite alternate; }
      .eq-bar-4 { animation: eqHeight4 1.1s ease-in-out infinite alternate; }
      .eq-bar-5 { animation: eqHeight5 0.8s ease-in-out infinite alternate; }
      .eq-bar-6 { animation: eqHeight6 1.4s ease-in-out infinite alternate; }
      .eq-bar-7 { animation: eqHeight7 1.0s ease-in-out infinite alternate; }
      .blink-slow { animation: blink 2s steps(2, start) infinite; }
      .float-3d { animation: floatIso 4s ease-in-out infinite alternate; }

      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseCore {
        0%, 100% { r: 18px; opacity: 0.8; filter: drop-shadow(0 0 6px #FF334B); }
        50% { r: 24px; opacity: 1; filter: drop-shadow(0 0 16px #FF334B); }
      }
      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(300px); opacity: 0.9; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes eqHeight1 { from { height: 8px; y: 220px; } to { height: 32px; y: 196px; } }
      @keyframes eqHeight2 { from { height: 16px; y: 212px; } to { height: 42px; y: 186px; } }
      @keyframes eqHeight3 { from { height: 6px; y: 222px; } to { height: 26px; y: 202px; } }
      @keyframes eqHeight4 { from { height: 20px; y: 208px; } to { height: 48px; y: 180px; } }
      @keyframes eqHeight5 { from { height: 10px; y: 218px; } to { height: 36px; y: 192px; } }
      @keyframes eqHeight6 { from { height: 18px; y: 210px; } to { height: 45px; y: 183px; } }
      @keyframes eqHeight7 { from { height: 12px; y: 216px; } to { height: 30px; y: 198px; } }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes floatIso {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Border & Blueprint Background -->
  <rect x="1" y="1" width="848" height="318" rx="10" fill="#090c10" stroke="#30363d" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="316" rx="9" fill="url(#blueprintGrid)" />

  <!-- Corner Tactical Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#FF334B" stroke-width="2.5" />
  <path d="M 838 24 L 838 12 L 826 12" fill="none" stroke="#FF334B" stroke-width="2.5" />
  <path d="M 12 296 L 12 308 L 24 308" fill="none" stroke="#FF334B" stroke-width="2.5" />
  <path d="M 838 296 L 838 308 L 826 308" fill="none" stroke="#FF334B" stroke-width="2.5" />

  <!-- Scanning Vertical Laser Line -->
  <g class="laser-scan">
    <line x1="20" y1="10" x2="830" y2="10" stroke="url(#laserGrad)" stroke-width="2" />
    <polygon points="20,8 30,10 20,12" fill="#FF334B" />
    <polygon points="830,8 820,10 830,12" fill="#FF334B" />
  </g>

  <!-- ======================================================================= -->
  <!-- LEFT: 3D ISOMETRIC HEIST VAULT & NEURAL LOCK DIAL                       -->
  <!-- Center: (170, 160)                                                     -->
  <!-- ======================================================================= -->
  <g id="isometricVaultSystem">
    <!-- Isometric Grid Ground Plane -->
    <g opacity="0.3" stroke="#FF334B" stroke-width="0.8" fill="none">
      <polygon points="170,230 270,280 170,330 70,280" />
      <polygon points="170,245 245,282 170,320 95,282" />
      <line x1="70" y1="280" x2="270" y2="280" />
      <line x1="170" y1="230" x2="170" y2="330" />
    </g>

    <!-- Outer Vault Gear Ring (Spin CCW) -->
    <g class="spin-ccw">
      <circle cx="170" cy="160" r="105" fill="none" stroke="#21262d" stroke-width="2" />
      <circle cx="170" cy="160" r="100" fill="none" stroke="#FF334B" stroke-width="1.5" stroke-dasharray="14 10 4 10" opacity="0.8" />
      <!-- Radial Vault Bolt Teeth -->
      <line x1="170" y1="52" x2="170" y2="60" stroke="#FF334B" stroke-width="3" />
      <line x1="170" y1="260" x2="170" y2="268" stroke="#FF334B" stroke-width="3" />
      <line x1="62" y1="160" x2="70" y2="160" stroke="#FF334B" stroke-width="3" />
      <line x1="270" y1="160" x2="278" y2="160" stroke="#FF334B" stroke-width="3" />
      <line x1="94" y1="84" x2="100" y2="90" stroke="#FF334B" stroke-width="3" />
      <line x1="240" y1="230" x2="246" y2="236" stroke="#FF334B" stroke-width="3" />
      <line x1="246" y1="84" x2="240" y2="90" stroke="#FF334B" stroke-width="3" />
      <line x1="100" y1="230" x2="94" y2="236" stroke="#FF334B" stroke-width="3" />
    </g>

    <!-- Middle Vault Calibration Dial (Spin CW) -->
    <g class="spin-cw">
      <circle cx="170" cy="160" r="80" fill="none" stroke="#30363d" stroke-width="1" />
      <circle cx="170" cy="160" r="76" fill="none" stroke="#FF334B" stroke-width="1.8" stroke-dasharray="2 6" opacity="0.75" />
      <circle cx="170" cy="160" r="70" fill="none" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="32 18" />
    </g>

    <!-- Radar Sweep Laser inside Dial -->
    <g class="laser-sweep" opacity="0.45">
      <line x1="170" y1="160" x2="240" y2="160" stroke="#FF334B" stroke-width="2" filter="url(#softGlow)" />
      <path d="M 170 160 L 235 125 A 70 70 0 0 1 240 160 Z" fill="url(#redFade)" />
    </g>

    <!-- Inner Fast Ring with Sector Markings -->
    <g class="spin-fast">
      <circle cx="170" cy="160" r="52" fill="none" stroke="#FF334B" stroke-width="1.5" stroke-dasharray="18 12" />
      <circle cx="170" cy="160" r="46" fill="none" stroke="#30363d" stroke-width="1" />
    </g>

    <!-- 3D Floating Isometric Cube (Vault Centerpiece) -->
    <g class="float-3d">
      <!-- Top Face -->
      <polygon points="170,132 195,145 170,158 145,145" fill="#FF334B" fill-opacity="0.25" stroke="#FF334B" stroke-width="1.6" filter="url(#softGlow)" />
      <!-- Left Face -->
      <polygon points="145,145 170,158 170,188 145,175" fill="#0d1117" fill-opacity="0.85" stroke="#FF334B" stroke-width="1.6" />
      <!-- Right Face -->
      <polygon points="170,158 195,145 195,175 170,188" fill="#161b22" fill-opacity="0.85" stroke="#FF334B" stroke-width="1.6" />

      <!-- Inner Glowing Crimson Neural Core -->
      <circle cx="170" cy="160" r="7" fill="#ffffff" filter="url(#crimsonGlow)" />
      <circle cx="170" cy="160" r="14" fill="none" stroke="#FF334B" stroke-width="2" class="pulse-core" />
    </g>

    <!-- Tactical Label Below Vault -->
    <text x="170" y="295" fill="#8b949e" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="2">
      AI VAULT // CIPHER 0x7E50914
    </text>
  </g>

  <!-- Vertical Divider / Laser Bar -->
  <line x1="330" y1="25" x2="330" y2="295" stroke="#21262d" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="330" cy="160" r="3" fill="#FF334B" />

  <!-- ======================================================================= -->
  <!-- RIGHT: THE PROFESSOR'S TELEMETRY & STRATEGIC BLUEPRINT HUD             -->
  <!-- ======================================================================= -->
  <g transform="translate(355, 30)">
    <!-- Header Block -->
    <g>
      <rect x="0" y="0" width="130" height="20" rx="3" fill="#FF334B" fill-opacity="0.15" stroke="#FF334B" stroke-width="1" />
      <circle cx="12" cy="10" r="4" fill="#FF334B" class="blink-slow" />
      <text x="24" y="14" fill="#FF334B" font-size="9.5" font-weight="700" letter-spacing="1.5">PLAN: ROYAL AI</text>

      <text x="145" y="14" fill="#8b949e" font-size="10" letter-spacing="1">COORD: 40.4168°N 3.7038°W</text>
      <text x="440" y="14" fill="#FF334B" font-size="10" font-weight="600" text-anchor="end">SYS_STATUS: 100%</text>
    </g>

    <!-- Subheading -->
    <text x="0" y="44" fill="#f0f6fc" font-size="15" font-weight="700" letter-spacing="0.5">
      OPERATION: ZERO-DRIFT ARCHITECTURE
    </text>
    <text x="0" y="62" fill="#8b949e" font-size="11">
      Operative: <tspan fill="#FF334B" font-weight="600">Isha Negi (@ishanegi7)</tspan> | Clearance: <tspan fill="#c9d1d9">Deep Learning &amp; RAG Systems</tspan>
    </text>

    <!-- HUD Grid Line -->
    <line x1="0" y1="74" x2="445" y2="74" stroke="#21262d" stroke-width="1" />

    <!-- 3 Telemetry Data Cells -->
    <g transform="translate(0, 85)">
      <!-- Cell 1: RAG Latency -->
      <rect x="0" y="0" width="140" height="54" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="10" y="16" fill="#8b949e" font-size="9" font-weight="600">INFERENCE LATENCY</text>
      <text x="10" y="38" fill="#f0f6fc" font-size="18" font-weight="700">1.4 <tspan font-size="11" fill="#FF334B">ms</tspan></text>
      <path d="M 95 32 L 105 24 L 115 28 L 128 18" fill="none" stroke="#FF334B" stroke-width="1.8" />
      <circle cx="128" cy="18" r="2.5" fill="#FF334B" />

      <!-- Cell 2: Graph Accuracy -->
      <rect x="152" y="0" width="140" height="54" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="162" y="16" fill="#8b949e" font-size="9" font-weight="600">GRAPH CONSISTENCY</text>
      <text x="162" y="38" fill="#f0f6fc" font-size="18" font-weight="700">99.8 <tspan font-size="11" fill="#FF334B">%</tspan></text>
      <circle cx="265" cy="27" r="14" fill="none" stroke="#21262d" stroke-width="3" />
      <circle cx="265" cy="27" r="14" fill="none" stroke="#FF334B" stroke-width="3" stroke-dasharray="75 25" />

      <!-- Cell 3: Security Guard -->
      <rect x="305" y="0" width="140" height="54" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="315" y="16" fill="#8b949e" font-size="9" font-weight="600">API ZERO-TRUST</text>
      <text x="315" y="38" fill="#FF334B" font-size="15" font-weight="700">SHIELDED</text>
      <path d="M 418 20 L 428 24 L 428 34 Q 428 42 418 45 Q 408 42 408 34 L 408 24 Z" fill="#FF334B" fill-opacity="0.15" stroke="#FF334B" stroke-width="1.5" />
    </g>

    <!-- Bella Ciao Neural Audio / Telemetry Waveform -->
    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="445" height="58" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="12" y="16" fill="#8b949e" font-size="9" font-weight="600">NEURAL CARRIER FREQUENCY // BELLA CIAO PROTOCOL</text>
      <text x="432" y="16" fill="#FF334B" font-size="9" font-weight="600" text-anchor="end" class="blink-slow">LIVE STREAM</text>

      <!-- Equalizer Bars -->
      <g fill="#FF334B">
        <rect x="15" y="24" width="4" height="24" rx="1" class="eq-bar-1" />
        <rect x="23" y="24" width="4" height="24" rx="1" class="eq-bar-3" />
        <rect x="31" y="24" width="4" height="24" rx="1" class="eq-bar-2" />
        <rect x="39" y="24" width="4" height="24" rx="1" class="eq-bar-5" />
        <rect x="47" y="24" width="4" height="24" rx="1" class="eq-bar-4" />
        <rect x="55" y="24" width="4" height="24" rx="1" class="eq-bar-7" />
        <rect x="63" y="24" width="4" height="24" rx="1" class="eq-bar-6" />
        <rect x="71" y="24" width="4" height="24" rx="1" class="eq-bar-2" />
        <rect x="79" y="24" width="4" height="24" rx="1" class="eq-bar-4" />
        <rect x="87" y="24" width="4" height="24" rx="1" class="eq-bar-1" />
        <rect x="95" y="24" width="4" height="24" rx="1" class="eq-bar-5" />
        <rect x="103" y="24" width="4" height="24" rx="1" class="eq-bar-3" />
      </g>

      <!-- Waveform Polyline -->
      <polyline points="120,40 140,32 160,45 180,25 200,38 220,20 240,42 260,26 280,36 300,18 320,38 340,30 360,42 380,26 400,35 430,30" 
                fill="none" stroke="#FF334B" stroke-width="1.8" opacity="0.85" filter="url(#softGlow)" />
    </g>

    <!-- Terminal Footer Line -->
    <g transform="translate(0, 222)">
      <text x="0" y="15" fill="#8b949e" font-size="10">
        <tspan fill="#FF334B">> </tspan>DECRYPTING TIME-LOCK: <tspan fill="#f0f6fc">00:00:00 [ACCESS GRANTED]</tspan>
      </text>
      <text x="0" y="32" fill="#8b949e" font-size="10">
        <tspan fill="#FF334B">> </tspan>STRATEGY: <tspan fill="#c9d1d9">"Timing is everything. No hesitation, pure execution."</tspan>
      </text>
    </g>
  </g>
</svg>
